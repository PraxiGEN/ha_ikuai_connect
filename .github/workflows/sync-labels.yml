name: Label Sync

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GitHub Labeler
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
          skip-delete: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
